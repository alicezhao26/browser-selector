<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Selector Settings</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="wrap">
    <header>
      <img src="../../icons/icon48.png" alt="" width="32" height="32">
      <div>
        <h1 data-i18n="appName"></h1>
        <p class="sub"><span data-i18n="optSubtitle"></span> <span id="status" class="status"></span></p>
      </div>
    </header>

    <section class="card">
      <label class="field inline">
        <span data-i18n="language"></span>
        <select id="language"></select>
      </label>
      <p class="hint" data-i18n="optLanguageHint"></p>
    </section>

    <section class="card">
      <h2 data-i18n="optShortcutsTitle"></h2>
      <div class="cmds" id="cmds"></div>
      <p class="hint"><span data-i18n="optShortcutsHint"></span> <button class="link" id="shortcuts" data-i18n="optShortcutsLink"></button></p>
      <h3 data-i18n="optBasicKeys"></h3>
      <table class="keys">
        <tr><td><kbd data-i18n="keyClick"></kbd></td><td data-i18n="descCopyCss"></td></tr>
        <tr><td><kbd>S</kbd></td><td data-i18n="descShotElement"></td></tr>
        <tr><td><kbd data-i18n="keyRightClick"></kbd></td><td data-i18n="descRightClick"></td></tr>
        <tr><td><kbd>Esc</kbd></td><td data-i18n="descExit"></td></tr>
      </table>
      <details class="advanced">
        <summary data-i18n="optAdvancedKeys"></summary>
      <table class="keys">
        <tr><td><kbd>C</kbd> <kbd>Ctrl+C</kbd></td><td data-i18n="descCopyCss"></td></tr>
        <tr><td><kbd>1</kbd>–<kbd>4</kbd></td><td data-i18n="descCopyAlt"></td></tr>
        <tr><td><kbd>X</kbd></td><td data-i18n="descCopyXpath"></td></tr>
        <tr><td><kbd>J</kbd></td><td data-i18n="descCopyJs"></td></tr>
        <tr><td><kbd>T</kbd> / <kbd>O</kbd></td><td data-i18n="descCopyTextHtml"></td></tr>
        <tr><td><kbd>V</kbd> / <kbd>F</kbd></td><td data-i18n="descShotPage"></td></tr>
        <tr><td><kbd>↑</kbd> <kbd>↓</kbd></td><td data-i18n="descParentChild"></td></tr>
        <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td data-i18n="descSiblings"></td></tr>
        <tr><td><kbd>Space</kbd></td><td data-i18n="descLock"></td></tr>
        <tr><td><kbd>H</kbd></td><td data-i18n="descHints"></td></tr>
      </table>
      </details>
    </section>

    <section class="card">
      <h2 data-i18n="optSelectorTitle"></h2>
      <label class="field">
        <span><span data-i18n="optPreferredAttrs"></span> <small data-i18n="optPreferredAttrsHint"></small></span>
        <textarea id="preferredAttributes" rows="5" class="mono" spellcheck="false"></textarea>
      </label>
      <label class="field">
        <span><span data-i18n="optIgnore"></span> <small data-i18n="optIgnoreHint"></small></span>
        <textarea id="ignorePatterns" rows="4" class="mono" spellcheck="false"></textarea>
      </label>
      <div class="grid">
        <label class="check"><input type="checkbox" id="useClasses"> <span data-i18n="optUseClasses"></span></label>
        <label class="check"><input type="checkbox" id="allowNthChild"> <span data-i18n-html="optAllowNth"></span></label>
        <label class="field inline"><span data-i18n="optMaxDepth"></span><input type="number" id="maxDepth" min="1" max="12"></label>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="optPickerTitle"></h2>
      <div class="grid">
        <label class="field inline"><span data-i18n="optClickAction"></span>
          <select id="clickAction">
            <option value="css" data-i18n="optClickCss"></option>
            <option value="xpath" data-i18n="optClickXpath"></option>
            <option value="jspath" data-i18n="optClickJs"></option>
            <option value="screenshot" data-i18n="optClickShot"></option>
            <option value="none" data-i18n="optClickNone"></option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="exitAfterCopy"> <span data-i18n="optExitAfter"></span></label>
        <label class="check"><input type="checkbox" id="showPanel"> <span data-i18n="optShowPanel"></span></label>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="optShotTitle"></h2>
      <div class="grid">
        <label class="check"><input type="checkbox" id="screenshotCopy"> <span data-i18n="optShotCopy"></span></label>
        <label class="check"><input type="checkbox" id="screenshotDownload"> <span data-i18n="optShotDownload"></span></label>
        <label class="check"><input type="checkbox" id="hideFixedOnStitch"> <span data-i18n="optHideFixed"></span></label>
        <label class="field inline"><span data-i18n="optFormat"></span>
          <select id="screenshotFormat"><option value="png">PNG</option><option value="jpeg">JPEG</option></select>
        </label>
        <label class="field inline"><span data-i18n="optJpegQuality"></span><input type="number" id="jpegQuality" min="40" max="100"></label>
        <label class="field inline"><span data-i18n="optPadding"></span><input type="number" id="screenshotPadding" min="0" max="200"></label>
      </div>
      <p class="hint" data-i18n-html="optShotHint"></p>
    </section>

    <div class="footer-actions">
      <button class="btn" id="reset" data-i18n="optReset"></button>
    </div>
  </div>
  <script src="../shared/defaults.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/locales/en.js"></script>
  <script src="../shared/locales/zh_CN.js"></script>
  <script src="options.js"></script>
</body>
</html>
