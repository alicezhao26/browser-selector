<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Browser Selector</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../../icons/icon32.png" alt="" width="20" height="20">
    <h1 data-i18n="appName"></h1>
    <select id="language" class="lang" data-i18n-title="language" data-i18n-aria-label="language"></select>
    <button class="icon-btn" id="options" data-i18n-title="popupSettings" data-i18n-aria-label="popupSettings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.830 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main>
    <div class="actions">
      <button class="action primary" data-action="pick">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
        <span class="label" data-i18n="popupPick"></span><kbd data-cmd="toggle-picker"></kbd>
      </button>
      <button class="action" data-action="visible">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/></svg>
        <span class="label" data-i18n="popupVisible"></span><kbd data-cmd="screenshot-visible"></kbd>
      </button>
      <button class="action" data-action="full">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
        <span class="label" data-i18n="popupFull"></span><kbd data-cmd="screenshot-full"></kbd>
      </button>
    </div>
    <p class="error" id="error" hidden></p>

    <section class="history">
      <div class="section-head">
        <h2 data-i18n="popupRecent"></h2>
        <button class="link" id="clear" data-i18n="popupClear"></button>
      </div>
      <ul id="history"></ul>
      <p class="empty" id="empty"></p>
    </section>
  </main>

  <footer>
    <span data-i18n-html="popupFooterHint"></span>
    <button class="link" id="shortcuts" data-i18n="popupChangeShortcuts"></button>
  </footer>
  <script src="../shared/defaults.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/locales/en.js"></script>
  <script src="../shared/locales/zh_CN.js"></script>
  <script src="popup.js"></script>
</body>
</html>
